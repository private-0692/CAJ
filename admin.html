<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Tu Marca</title><link rel="stylesheet" href="admin.css"></head>
<body>
<aside><div class="logo">TU<span>MARCA</span><small>ADMIN PANEL</small></div><a class="active" href="#contenido">Contenido</a><a href="#fotos">Fotos</a><a href="#servicios">Servicios</a></aside>
<main>
<header><div><p class="eyebrow">CONTROL CENTER</p><h1>Admin Panel</h1></div><div class="actions"><button id="preview">Vista previa</button><button class="primary" id="save">Guardar cambios</button></div></header>

<section id="contenido" class="panel"><h2>Contenido principal</h2><div class="grid">
<label>Título principal<input id="heroTitle"></label>
<label>Texto principal<textarea id="heroText"></textarea></label>
<label>Título de información<input id="infoTitle"></label>
<label>Información<textarea id="infoText"></textarea></label>
<label>Texto de contacto<input id="contactText"></label>
<label>Teléfono<input id="phone"></label>
<label>Email<input id="email"></label>
</div></section>

<section id="fotos" class="panel"><div class="title-row"><div><h2>Fotos</h2><p>Cambia las imágenes de la web pegando una URL de imagen. Los cambios se guardan en este navegador.</p></div></div>
<label>Imagen principal<input id="heroImage" placeholder="https://..."></label>
<div id="photoGrid" class="photo-grid"></div>
<div class="add-row"><input id="newPhoto" placeholder="URL de una nueva foto"><button id="addPhoto">+ Agregar foto</button></div></section>

<section id="servicios" class="panel"><h2>Servicios</h2><div id="serviceEditor"></div></section>
</main>
<script src="admin.js"></script>
</body>
</html>
